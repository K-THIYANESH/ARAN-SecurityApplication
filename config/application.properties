# ═══════════════════════════════════════════════════════════════
#  ARAN — Autonomous Risk Analysis & Network Security Platform
#  Configuration file
# ═══════════════════════════════════════════════════════════════

# API server port
api.port=8085

# Storage mode: FILE (default) or MYSQL
storage.mode=FILE

# ─── MySQL settings (used when storage.mode=MYSQL) ───────────
db.url=jdbc:mysql://localhost:3306/aran
db.user=root
db.password=CHANGE_ME

# ─── Automatic log monitoring ─────────────────────────────────
monitor.log.file=logs/security-events.log
monitor.interval.ms=1000

# ─── Threat detection thresholds ──────────────────────────────
bruteforce.threshold=3
bruteforce.window.minutes=5

# ─── Risk score thresholds ────────────────────────────────────
# Incident is created when risk score >= this value
risk.threshold.high=60
risk.threshold.critical=80
